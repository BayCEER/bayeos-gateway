logging.level.org.hibernate=error
logging.level.org.thymeleaf=error
logging.pattern.console=[%thread] %-5level %logger.%M - %msg%n

server.port=${GW_PORT:5533}
server.servlet.contextPath=${GW_CONTEXT_PATH:/gateway}
logging.level.root=${GW_LOGGING_LEVEL_ROOT:INFO}

spring.mail.host=${GW_MAIL_HOST:}
spring.mail.port=${GW_MAIL_PORT:25}
spring.mail.username=${GW_MAIL_USERNAME:}
spring.mail.password=${GW_MAIL_PASSWORD:}

spring.datasource.url=${GW_DB_URL:jdbc:postgresql://localhost:5432/xbee}
spring.datasource.username=${GW_DB_USER:xbee}
spring.datasource.password=${GW_DB_PASSWORD:bayeos}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.tomcat.max-wait=10000
spring.datasource.tomcat.max-active=50

# Flyway db migration on startup
# baseline-version=999: already migrated databases (legacy deployments) are
# baselined and skipped, empty databases run all V1.99..V2.105 scripts.
spring.flyway.url=${GW_DB_URL:jdbc:postgresql://localhost:5432/xbee}
spring.flyway.username=${POSTGRES_USER:bayeos}
spring.flyway.password=${POSTGRES_PASSWORD:bayeos}
spring.flyway.locations=classpath:db/migration,classpath:db/callback
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=999
# grantee of db/callback/afterMigrate.sql (the application login)
spring.flyway.placeholders.app_user=${spring.datasource.username:xbee}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.javax.persistence.validation.mode=none


project.version=${project.version}
build.year=${build.year}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=256MB
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false